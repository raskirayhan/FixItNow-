name: Feature request
description: Suggest an improvement or new capability for FixItNow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Do not include secrets or private user data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like FixItNow to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend API
        - Database or Prisma
        - Payments
        - Deployment or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add links, sketches, or acceptance criteria when useful.
